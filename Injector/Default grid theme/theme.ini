; theme.ini -- fine-tuning knobs for this theme, read once at boot by ThemeConfig (romsel_dsimenutheme/
; arm9/source/graphics/ThemeConfig.cpp). Every key below has a hardcoded default (shown in each
; comment) -- if a key is missing entirely, that default is used, so it's always safe to delete a
; line you don't want to touch. Values are plain integers; 0x-prefixed ones are 16-bit BGR555 colors
; (xbbbbbgggggrrrrr). Lines starting with ";" are comments (also "/" or "!" -- but ";" is the
; convention used here); nothing else is: nothing after a value on the same line is safe to add as a
; trailing comment, put comments on their own line instead.
;
; This is the DSi GRID theme (romsel_dsimenutheme, ms().theme == EThemeDSi) -- the group of keys
; marked "legacy carousel" below configure the OLD 3-row scrolling carousel this theme replaced,
; and are still read by ThemeConfig but never consumed by the grid's own rendering path (GridView,
; GameTitleComponent, StatusBarComponent, GameLogoComponent -- see FRONTEND.md). They're kept here,
; at their inherited defaults, only so switching this SD card to a non-grid theme (3DS/Saturn/HBL)
; doesn't fall back to some other theme's numbers. You can safely ignore that whole block.
;
; The grid's own geometry (rows, columns, spacing, scroll speed, cursor) is NOT here -- it lives in
; this same folder's layout.json (ThemeLayout), which is what GridView actually reads.

[THEME]

; ---- Legacy carousel (pre-grid theme) -- unused by this theme's actual on-screen rendering ----
; Position/size of the sprite border drawn around the selected icon in the old carousel.
StartBorderRenderY	= 88
StartBorderSpriteW	= 32
StartBorderSpriteH	= 80
; Y position of the "press start"/"press A" text under the old carousel's selected icon.
StartTextRenderY	= 143
; Position of the speech-bubble tip drawn over the old carousel's start border/box.
BubbleTipRenderY	= 80
BubbleTipRenderX	= 122
BubbleTipSpriteW	= 11
BubbleTipSpriteH	= 8
; Old carousel's title box: initial Y position, max text lines before truncating, text Y position
; and max width (px) before wrapping, and whether to use the large font.
TitleboxRenderY		= 92
TitleboxMaxLines	= 4
TitleboxTextY		= 35
TitleboxTextW		= 240
TitleboxTextLarge	= 1

; ---- Top screen (bottom-screen shoulder icons are the only one of these still live on the grid) ----
; Position of the volume icon/bar on the top screen.
VolumeRenderX		= 4
VolumeRenderY		= 5
; Position of the left/right shoulder-button icons on the top screen (still used by the grid --
; drawn once per frame from the main loop regardless of theme).
ShoulderLRenderY	= 172
ShoulderLRenderX	= 0
ShoulderRRenderY	= 172
ShoulderRRenderX	= 178
; Position of the OLD single battery icon on the top screen (legacy path, separate from this grid
; theme's own status bar below -- see StatusBarContentOffsetX/Y and grf/status_bar.bmp).
BatteryRenderY		= 5
BatteryRenderX		= 235
; Y position of the DSi profile username text on the top screen.
UsernameRenderY		= 5

; ---- Grid top-screen HUD (this theme's actual components -- see FRONTEND.md) ----
; Shifts the battery+clock TOGETHER inside grf/status_bar.bmp (px). Positive X = right, positive
; Y = down. Their layout relative to each other (battery right-anchored, clock to its left) never
; changes -- this only moves the pair as a block, e.g. to match a status_bar.bmp with a differently
; placed cutout. Default 0,0 = no shift (whatever loadTopScreenBoxBmp's opaque-box detection finds).
StatusBarContentOffsetX	= 0
StatusBarContentOffsetY	= 0
; Scales the selected game's logo (100 = normal size, drawn at the PNG's own downscaled resolution).
; Applies on top of the selection's zoom-in/out animation -- that animation still goes from 0 up to
; whatever size this produces, not up to 100%.
LogoZoomPercent		= 100
; Shifts the game logo from the top screen's centre (px). Can be negative (up/left).
LogoOffsetX		= 0
LogoOffsetY		= 0

; ---- Colors (BGR555, 0x0000 = black) ----
; Font colors used by regular UI text. FontPalette3/4 are unused by most fonts (2-color glyphs).
FontPalette1		= 0x0000
FontPalette2		= 0xDEF7
FontPalette3		= 0xC631
FontPalette4		= 0xA108
; Font colors used specifically inside dialog boxes (SELECT menu, confirmations, etc.).
FontPaletteDialog1	= 0xFFFF
FontPaletteDialog4	= 0xFFFF

; ---- "Use the DSi profile theme's palette instead of this asset's own colors" toggles ----
; 1 = recolor this element using the console's DSi profile color; 0 = keep the asset's own palette.
StartTextUserPalette	= 0
StartBorderUserPalette	= 1
ButtonArrowUserPalette	= 0
MovingArrowUserPalette	= 1
LaunchDotsUserPalette	= 0
DialogBoxUserPalette	= 0
UsernameUserPalette	= 0
; 1 if this theme ships purple-colored battery icon variants alongside the default blue/red ones
; (used automatically when the console's power LED color is purple).
PurpleBatteryAvailable	= 1
; Whether the DSi profile photo is drawn on the top screen (0 = never, regardless of the user's
; own "show photo" setting).
RenderPhoto		= 0

; MacroMode override: when the 3DS/2DS "Macro Mode" magnifier is on, these two TitleboxText* values
; (see the legacy-carousel block above) are used instead of the normal ones, since the enlarged UI
; needs different text wrapping. Unused by this theme for the same reason the values above are.
[MACRO]
TitleboxTextY	= 42
TitleboxTextW	= 224
